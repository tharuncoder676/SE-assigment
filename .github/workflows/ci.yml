name: SmartCare CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: smartcare/api

jobs:
# ---------------------------------------------------------------- stage 1
  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install linters
        run: pip install ruff bandit
      - name: Style and correctness (ruff)
        run: ruff check backend/app
      - name: Security scan (bandit)
        run: bandit -r backend/app -ll

# ---------------------------------------------------------------- stage 2
  test:
    name: Automated tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r backend/requirements.txt coverage
      - name: Run unit and integration tests
        working-directory: backend
        env:
          PBKDF2_ITERATIONS: "1000"
          JWT_SECRET: ci-test-secret
        run: coverage run -m pytest
      - name: Coverage report
        working-directory: backend
        run: |
          coverage report -m
          coverage xml
      - name: Publish test artefacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

# ---------------------------------------------------------------- stage 3
  build:
    name: Build container image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        run: |
          docker run -d --name smoke -p 8000:8000 ${{ env.IMAGE_NAME }}:${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -fs http://localhost:8000/health; then echo " -> healthy"; exit 0; fi
            sleep 2
          done
          echo "container did not become healthy"; docker logs smoke; exit 1

# ---------------------------------------------------------------- stage 4
  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Roll out the new revision
        run: echo "docker compose up -d --no-deps --build api  # executed on the staging host"
