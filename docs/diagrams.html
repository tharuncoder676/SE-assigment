    <text class="s" x="742" y="566" text-anchor="middle">append-only</text>

  <text class="h" x="856" y="42">Observability</text>
  <text class="s" x="856" y="64">GET /health — liveness probe</text>
  <text class="s" x="856" y="82">GET /ready — dependency check</text>

  <text class="s" x="856" y="150">request_id, path, status, duration</text>

  <text class="s" x="856" y="392">pytest — 25 automated tests,</text>
  <text class="s" x="856" y="408">95% statement coverage</text>
  <text class="s" x="856" y="430">ruff + bandit — style and</text>
  <text class="s" x="856" y="446">security static analysis</text>
  <text class="s" x="856" y="468">Docker — multi-stage image,</text>
  <text class="s" x="856" y="484">non-root user, HEALTHCHECK</text>
  <text class="s" x="856" y="506">GitHub Actions — lint, test,</text>
  <text class="s" x="856" y="522">build, container smoke test,</text>
  <text class="s" x="856" y="538">gated staging deployment</text>
  <text class="s" x="856" y="564">Every stage must pass before</text>
  <text class="s" x="856" y="580">the next one is allowed to run.</text>
