[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]
exclude = [".git", "__pycache__", ".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import ordering
    "B",   # flake8-bugbear
    "C4",  # comprehension simplifications
    "UP",  # pyupgrade
]
ignore = [
    # FastAPI expresses dependency injection as a call in the argument default
    # (`db: Session = Depends(get_db)`). This is the documented, idiomatic
    # form of the framework, so bugbear's B008 is a false positive here.
    "B008",
    # Percent-style formatting is used consistently across the code base for
    # log and message construction; migrating to f-strings is cosmetic only.
    "UP031",
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101"]   # assert is the point of a test

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
